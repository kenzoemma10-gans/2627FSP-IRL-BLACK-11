<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Container Yard Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0e1214;
    --steel:#1b2226;
    --steel-2:#232c31;
    --line:#3a454b;
    --paper:#e9eaea;
    --dim:#93a1a8;
    --safety:#ff6a13;
    --safety-dim:#c9540d;
    --caution:#f5b700;
    --danger:#e6394a;
    --ok:#5fb46a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#000; overflow:hidden;
    font-family:'Barlow',-apple-system,sans-serif;
    touch-action:none; overscroll-behavior:none;
    user-select:none; -webkit-user-select:none;
  }
  #stage{ position:fixed; inset:0; }
  canvas{ display:block; width:100%; height:100%; touch-action:none; }

  /* ---------- HUD shell ---------- */
  #hud{ position:fixed; inset:0; pointer-events:none; font-family:'Barlow',sans-serif; }
  .stencil{ font-family:'Oswald',sans-serif; letter-spacing:0.03em; }

  .placard{
    background:linear-gradient(180deg, rgba(27,34,38,.86), rgba(14,18,20,.86));
    border:1px solid var(--line);
    border-left:3px solid var(--safety);
    padding:6px 12px;
    color:var(--paper);
  }

  #weaponTag{
    position:fixed; top:14px; left:14px;
    font-size:14px; font-weight:600; text-transform:uppercase;
  }
  #weaponTag .sub{ display:block; font-size:10px; color:var(--dim); text-transform:none; letter-spacing:0; margin-top:1px; font-family:'Barlow'; }

  #enemyTag{
    position:fixed; top:14px; right:14px;
    font-size:14px; font-weight:600;
    border-left:3px solid var(--danger);
    text-align:right;
  }
  #enemyTag b{ color:var(--danger); font-size:16px; }

  /* crosshair */
  #crosshair{
    position:fixed; top:50%; left:50%; width:26px; height:26px;
    transform:translate(-50%,-50%);
  }
  #crosshair::before, #crosshair::after{
    content:''; position:absolute; background:var(--safety);
    box-shadow:0 0 2px rgba(0,0,0,.8);
  }
  #crosshair::before{ left:50%; top:0; width:2px; height:100%; transform:translateX(-1px); }
  #crosshair::after{ top:50%; left:0; height:2px; width:100%; transform:translateY(-1px); }
  #crosshair .gap{ position:absolute; inset:8px; background:transparent; }
  #crosshair.gapstyle::before{ clip-path: polygon(0 0,100% 0,100% 38%,0 38%,0 62%,100% 62%,100% 100%,0 100%); }
  #crosshair.gapstyle::after{ clip-path: polygon(0 0,38% 0,38% 100%,0 100%,0 0,62% 0,62% 100%,100% 100%,100% 0); }

  #hitmarker{
    position:fixed; top:50%; left:50%; width:30px; height:30px;
    transform:translate(-50%,-50%); opacity:0; pointer-events:none;
  }
  #hitmarker svg{ width:100%; height:100%; }
  #hitmarker.show{ opacity:1; animation:hitpop .18s ease-out; }
  @keyframes hitpop{ 0%{ transform:translate(-50%,-50%) scale(0.6); opacity:1;} 100%{ transform:translate(-50%,-50%) scale(1.15); opacity:0;} }

  /* HP readout — bottom center bar */
  #hpBarWrap{
    position:fixed; left:50%; bottom:20px; transform:translateX(-50%);
    width:min(360px, 72vw); text-align:center;
  }
  #hpBarLabel{
    font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.14em;
    margin-bottom:4px;
  }
  #hpBarLabel b{ color:var(--paper); font-weight:700; font-size:15px; letter-spacing:0; }
  #hpBarTrack{
    position:relative; height:16px; background:var(--steel-2);
    border:1px solid var(--line); overflow:hidden;
  }
  #hpBarFill{
    height:100%; width:100%; background:var(--ok);
    transition:width .12s ease-out, background-color .2s;
  }
  #hpBarFill.warn{ background:var(--caution); }
  #hpBarFill.crit{ background:var(--danger); }
  #regenPip{
    position:absolute; right:-4px; top:-10px; width:8px; height:8px; border-radius:50%;
    background:var(--ok); opacity:0; box-shadow:0 0 6px var(--ok);
    transition:opacity .2s;
  }
  #regenPip.on{ opacity:1; animation:pulse 1s infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.4);} }

  #protectBadge{
    margin-top:6px; font-size:10.5px; font-weight:600; letter-spacing:.06em;
    text-transform:uppercase; color:#1a0d02; background:var(--safety);
    display:inline-block; padding:2px 7px; opacity:0; transition:opacity .15s;
  }
  #protectBadge.on{ opacity:1; animation:pulse 1s infinite; }

  #killBonus{
    position:fixed; left:50%; bottom:78px; transform:translateX(-50%) translateY(0);
    font-family:'Oswald'; color:var(--ok); font-size:18px; font-weight:700;
    letter-spacing:.06em; opacity:0; pointer-events:none; text-shadow:0 0 8px rgba(0,0,0,.6);
  }
  #killBonus.show{ animation:killPop 1.1s ease-out; }
  @keyframes killPop{
    0%{ opacity:0; transform:translateX(-50%) translateY(8px); }
    18%{ opacity:1; transform:translateX(-50%) translateY(-6px); }
    75%{ opacity:1; transform:translateX(-50%) translateY(-16px); }
    100%{ opacity:0; transform:translateX(-50%) translateY(-24px); }
  }

  /* damage flash + death */
  #dmgFlash{
    position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(230,57,74,0) 40%, rgba(230,57,74,.55) 100%);
    opacity:0; transition:opacity .08s ease-out;
  }
  #dmgFlash.show{ opacity:1; transition:opacity 0s; }

  #deathScreen{
    position:fixed; inset:0; background:rgba(8,9,10,.88);
    display:none; align-items:center; justify-content:center; flex-direction:column;
    pointer-events:none;
  }
  #deathScreen.show{ display:flex; }
  #deathScreen h1{
    font-family:'Oswald'; color:var(--danger); font-size:42px; margin:0;
    letter-spacing:.08em; border-bottom:2px solid var(--danger); padding-bottom:10px;
  }
  #deathScreen p{ color:var(--dim); margin-top:14px; font-size:14px; }
  #deathScreen span{ color:var(--paper); font-weight:600; }

  /* settings (sensitivity) */
  #settingsBtn{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; pointer-events:auto; cursor:pointer; z-index:25;
  }
  #settingsPanel{
    position:fixed; top:54px; left:50%; transform:translateX(-50%);
    width:220px; z-index:25; pointer-events:none;
    opacity:0; transition:opacity .15s; text-align:left;
  }
  #settingsPanel.open{ opacity:1; pointer-events:auto; }
  #settingsPanel .s-row{ display:flex; justify-content:space-between; font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px; }
  #settingsPanel .s-row b{ color:var(--paper); }
  #settingsPanel input[type=range]{ width:100%; accent-color:var(--safety); }

  /* victory screen */
  #winScreen{
    position:fixed; inset:0; background:rgba(6,8,9,.92);
    display:none; align-items:center; justify-content:center; flex-direction:column;
    pointer-events:auto; z-index:30; padding:20px; text-align:center;
  }
  #winScreen.show{ display:flex; }
  #winScreen h1{
    font-family:'Oswald'; color:var(--ok); font-size:clamp(24px,6vw,36px);
    margin:0 0 14px; letter-spacing:.06em;
  }
  #winScreen img{
    max-width:min(360px, 84vw); max-height:62vh; object-fit:contain;
    border:2px solid var(--safety); box-shadow:0 0 40px rgba(255,106,19,.35);
  }
  #winScreen .hint{ color:var(--dim); font-size:12px; margin-top:14px; }

  /* start overlay */
  #startOverlay{
    position:fixed; inset:0; background:
      linear-gradient(rgba(10,13,14,.72), rgba(10,13,14,.86)),
      repeating-linear-gradient(135deg, #14181a 0 22px, #171c1e 22px 44px);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    z-index:20; padding:24px; text-align:center;
  }
  #startOverlay h1{
    font-family:'Oswald'; color:var(--paper); font-size:clamp(28px,7vw,46px);
    margin:0 0 6px; letter-spacing:.04em;
  }
  #startOverlay h1 span{ color:var(--safety); }
  #startOverlay .tag{ color:var(--dim); font-size:13px; margin-bottom:26px; letter-spacing:.1em; text-transform:uppercase; }
  #controlsGrid{
    display:grid; grid-template-columns:1fr 1fr; gap:8px 26px;
    margin-bottom:28px; max-width:420px;
  }
  #controlsGrid .row{ display:flex; justify-content:space-between; gap:14px; font-size:12.5px; color:var(--dim); border-bottom:1px solid var(--line); padding-bottom:4px; }
  #controlsGrid .row b{ color:var(--paper); font-weight:600; }
  #startBtn{
    font-family:'Oswald'; background:var(--safety); color:#1a0d02; border:none;
    padding:14px 42px; font-size:17px; letter-spacing:.08em; font-weight:600;
    box-shadow:0 4px 0 var(--safety-dim); cursor:pointer; pointer-events:auto;
  }
  #startBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--safety-dim); }
  #startOverlay .note{ margin-top:16px; font-size:11px; color:var(--dim); max-width:320px; }

  /* ---------- touch controls ---------- */
  #touchLayer{ position:fixed; inset:0; pointer-events:none; }
  .ctrl{ position:absolute; pointer-events:auto; touch-action:none; }

  #joyBase{
    left:22px; bottom:22px; width:118px; height:118px;
    border-radius:50%; border:2px solid rgba(233,234,234,.25);
    background:rgba(20,24,26,.35);
  }
  #joyKnob{
    position:absolute; left:50%; top:50%; width:52px; height:52px;
    margin-left:-26px; margin-top:-26px; border-radius:50%;
    background:rgba(255,106,19,.55); border:1px solid rgba(255,106,19,.9);
  }

  #fireBtn{
    right:24px; bottom:26px; width:86px; height:86px; border-radius:50%;
    background:rgba(230,57,74,.28); border:2px solid rgba(230,57,74,.8);
    display:flex; align-items:center; justify-content:center;
    font-family:'Oswald'; color:#fff; font-size:13px; letter-spacing:.06em;
  }
  #fireBtn.active{ background:rgba(230,57,74,.55); }

  #jumpBtn{
    right:20px; bottom:128px; width:56px; height:56px; border-radius:10px;
    background:rgba(233,234,234,.14); border:1px solid rgba(233,234,234,.35);
    display:flex; align-items:center; justify-content:center;
    font-family:'Oswald'; color:var(--paper); font-size:11px;
  }
  #sprintBtn{
    right:86px; bottom:128px; width:56px; height:56px; border-radius:10px;
    background:rgba(233,234,234,.14); border:1px solid rgba(233,234,234,.35);
    display:flex; align-items:center; justify-content:center;
    font-family:'Oswald'; color:var(--paper); font-size:10.5px; text-align:center;
  }
  #sprintBtn.on{ background:rgba(255,106,19,.5); border-color:var(--safety); }

  #reloadBtn{
    right:20px; bottom:256px; width:122px; height:38px; border-radius:8px;
    background:rgba(233,234,234,.14); border:1px solid rgba(233,234,234,.35);
    display:flex; align-items:center; justify-content:center;
    font-family:'Oswald'; color:var(--paper); font-size:11px; letter-spacing:.06em;
  }
  #reloadBtn.active{ background:rgba(255,106,19,.5); border-color:var(--safety); }

  #weaponBtns{ right:20px; bottom:192px; display:flex; gap:8px; }
  #weaponBtns .wbtn{
    width:44px; height:34px; border-radius:6px;
    background:rgba(233,234,234,.14); border:1px solid rgba(233,234,234,.35);
    display:flex; align-items:center; justify-content:center;
    font-family:'Oswald'; color:var(--paper); font-size:14px; position:static;
  }
  #weaponBtns .wbtn.sel{ background:rgba(255,106,19,.55); border-color:var(--safety); }

  #lookHint{
    position:fixed; top:50%; left:50%; transform:translate(-50%,40px);
    color:rgba(233,234,234,.35); font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; pointer-events:none;
  }
</style>
</head>
<body>
<div id="stage"></div>

<div id="hud">
  <div id="weaponTag" class="placard stencil">ASSAULT RIFLE<span class="sub" id="ammoSub">auto · hitscan</span></div>
  <div id="enemyTag" class="placard stencil">HOSTILES<br><b id="enemyCount">4</b></div>

  <div id="crosshair" class="gapstyle"></div>

    <svg viewBox="0 0 30 30"><path d="M6 6 L24 24 M24 6 L6 24" stroke="#fff" stroke-width="3" stroke-linecap="square"/></svg>
  </div>

  <div id="hpBarWrap" style="position:relative;">

  <div id="settingsPanel" class="placard">
